name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make generate crds
      - run: git diff --exit-code && test -z "$(git status --porcelain)"
      - run: make lint
      - run: make test
      - run: make release VERSION=ci
      - run: hack/check-release.sh
  e2e-kind:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - run: make e2e-kind
  e2e-init:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build release VERSION=dev
      - run: docker build -t ghcr.io/cloudyfolks-labs/bedrock:dev -f Containerfile .
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf hack/e2e-init.sh
  e2e-bundle:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - run: make build release VERSION=dev IMAGE=localhost:5000/bedrock:dev
      - run: docker build -t localhost:5000/bedrock:dev -f Containerfile .
      - run: docker run --rm -d -p 5000:5000 --name registry registry:3
      - run: docker push localhost:5000/bedrock:dev
      - run: make bundle VERSION=dev IMAGE=localhost:5000/bedrock:dev
      - run: docker rm -f registry
      - run: sudo -E env "PATH=$PATH" KUBECONFIG=/var/lib/k0s/pki/admin.conf BUNDLE=dist/bedrock-dev-bundle-amd64.tar.zst IMAGE=localhost:5000/bedrock:dev hack/e2e-init.sh
