apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gadgets.example.com
spec:
  group: example.com
  names:
    kind: Gadget
    plural: gadgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gadget-operator
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: gadget-operator
  template:
    metadata:
      labels:
        app: gadget-operator
    spec:
      containers:
        - name: operator
          image: quay.io/example/gadget-operator:2
